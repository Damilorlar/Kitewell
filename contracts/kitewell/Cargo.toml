[package]
name = "kitewell"
version = "0.1.0"
edition = "2021"
publish = false
description = "Kitewell registry — on-chain builder check-in for the Stellar Testnet lab"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "28.0.0-rc.2"

[dev-dependencies]
soroban-sdk = { version = "28.0.0-rc.2", features = ["testutils"] }
